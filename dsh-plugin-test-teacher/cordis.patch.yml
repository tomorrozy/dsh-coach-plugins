# dsh-test-teacher bundle patch: mounts the plugin into the host composition of
# a dsh profile. The host half serves one JSON RPC route for the browser half,
# registers the test-verify-coach skill and the testcoach_* sync tools; the
# browser half registers the left sidebar entry (sidebar.panellist) and its
# global page (main keyed slot, same id).
- insert:
    - id: dsh-test-teacher
      name: 'dsh-test-teacher'
      config:
        # 出题所属工程目录（复盘写入 <workspace>/面试记录/，状态里展示）。
        workspace: '%USERPROFILE%\Desktop\Taurus car'
